<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Tag</title></head>
<body>
<div id="root"></div>
<script>
  var P = window.Pun, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'pun-row pun-pad' },
    h(P.Tag, { tone: 'mint' }, 'ready'), h(P.Tag, { tone: 'zap' }, 'building'), h(P.Tag, { tone: 'lilac' }, 'designed'), h(P.Tag, { tone: 'gum' }, 'new'), h(P.Tag, null, 'next')));
</script>
</body>
</html>
