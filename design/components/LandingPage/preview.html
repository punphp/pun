<!-- @dsCard group="Pages" height=2900 width=1200 page subtitle="The marketing site, built only from the bundle" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Landing page</title>
<style>
  html, body { overflow-x: clip; }
  .lp { max-width: 1200px; margin: 0 auto; }
  .lp-w { padding: 0 var(--space-14); }
  .lp-nav { display: flex; align-items: center; justify-content: space-between; padding: 22px var(--space-14); }
  .lp-nav nav { display: flex; gap: 28px; align-items: center; font: 600 15px/1 var(--font-display); }
  .lp-nav a { color: var(--ink); text-decoration: none; }
  .lp-hero { display: grid; grid-template-columns: 1.1fr .9fr; gap: var(--space-14); align-items: center; padding: var(--space-10) var(--space-14) var(--space-24); }
  .lp-hero h1 { margin: var(--space-6) 0 var(--space-5); }
  .lp-hero .pun-lede { margin-bottom: var(--space-8); }
  .lp-stage { position: relative; aspect-ratio: 1 / 1; }
  .lp-stage .pun-panel { position: absolute; inset: 0; display: grid; place-items: center; }
  .lp-ring { position: absolute; width: 66%; aspect-ratio: 1; border-radius: 50%; background: var(--zap); border: var(--stroke) solid var(--outline); }
  .lp-stage img { position: relative; width: 92%; }
  .lp-stage .pun-burst { position: absolute; right: -22px; top: -26px; }
  .lp-tagloose { position: absolute; left: -22px; bottom: 48px; padding: 10px 14px; background: var(--card); border: var(--stroke) solid var(--outline); border-radius: var(--radius-sm); box-shadow: var(--pop); transform: rotate(var(--tilt-sticker)); font: 600 13px/1 var(--font-mono); }
  .lp-sec { padding: var(--space-24) var(--space-14) 0; }
  .lp-sec h2 { margin-bottom: var(--space-10); }
  .lp-tools { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; }
  .lp-race { display: grid; grid-template-columns: .8fr 1.2fr; gap: var(--space-14); align-items: end; }
  .lp-mega { font: 800 220px/.8 var(--font-display); letter-spacing: -.06em; margin: var(--space-6) 0 0; }
  .lp-mega sup { font-size: .32em; vertical-align: top; position: relative; top: .25em; }
  .lp-parity { display: grid; grid-template-columns: 1fr auto 1fr; gap: var(--space-6); align-items: center; }
  .lp-cta { margin: var(--space-28) var(--space-14) 0; padding: var(--space-14); display: grid; grid-template-columns: 1fr auto; gap: var(--space-8); align-items: center; }
  .lp-cta img { position: absolute; right: 250px; bottom: -36px; width: 230px; }
  .lp-foot { display: flex; justify-content: space-between; align-items: center; padding: var(--space-10) var(--space-14) var(--space-12); font: 500 12px/1 var(--font-mono); color: var(--ink-3); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var P = window.Pun, h = React.createElement;
  var MASCOT = '../../assets/Mascot/pun-sprinter.png', WORDMARK = '../../assets/Logos/pun-wordmark.svg', WORDMARK_REV = '../../assets/Logos/pun-wordmark-reverse.svg';
  var dark = document.documentElement.getAttribute('data-theme') === 'dark';
  function Page() {
    return h('div', { className: 'lp' },
      h('header', { className: 'lp-nav' },
        h('img', { src: dark ? WORDMARK_REV : WORDMARK, alt: 'pun', height: 40 }),
        h('nav', null, h('a', { href: '#' }, 'Docs'), h('a', { href: '#' }, 'Benchmarks'), h('a', { href: '#' }, 'Blog'), h('a', { href: '#' }, 'GitHub'),
          h(P.Button, { variant: 'zap', size: 'sm' }, 'Install'))),
      h('section', { className: 'lp-hero' },
        h('div', null,
          h(P.Pill, { tag: 'v0.1' }, 'pun format is Pint-identical'),
          h('h1', { className: 'pun-display', style: { '--pun-size': '88px' } }, 'PHP tooling, ', h(P.Highlight, null, 'zero'), ' waiting.'),
          h('p', { className: 'pun-lede' }, 'One Rust binary for format, lint and analyse. Reads your pint.json, gives the same bytes back, 51× sooner.'),
          h(P.InstallBox, { options: [
            { label: 'composer', command: 'composer require --dev punphp/pun' },
            { label: 'curl', command: 'curl -LsSf https://github.com/punphp/pun/releases/latest/download/punphp-installer.sh | sh' },
            { label: 'brew', command: 'brew install punphp/tap/pun' },
            { label: 'npm', command: 'npm install --save-dev @punphp/pun' }] }),
          h('div', { className: 'pun-row', style: { marginTop: 28 } }, h(P.Button, { variant: 'zap', arrow: true }, 'Get started'), h(P.Button, null, 'Read the docs'))),
        h('div', { className: 'lp-stage' },
          h(P.StickerPanel, null, h('div', { className: 'lp-ring' }), h('img', { src: MASCOT, alt: 'The Pun mascot: a grape elephant in yellow sneakers, sprinting and winking' })),
          h(P.Burst, { sub: 'vs Pint' }, '51×'),
          h('div', { className: 'lp-tagloose' }, '$ pun format'))),
      h(P.Ribbon, { items: ['one binary', 'reads pint.json', 'byte-for-byte', 'built in Rust', 'one pun.toml', 'no levels', 'no PHP to check'] }),
      h('section', { className: 'lp-sec' },
        h('p', { className: 'pun-kicker' }, 'one install'),
        h('h2', { className: 'pun-h1' }, 'Four tools. ', h(P.Highlight, { tone: 'gum' }, 'One'), ' binary.'),
        h('div', { className: 'lp-tools' },
          h(P.ToolCard, { tilt: -1, tone: 'zap', title: 'Format', replaces: 'Pint · PHP-CS-Fixer', description: 'Pint-identical bytes, 51× faster.', command: 'pun format', status: 'ready' }),
          h(P.ToolCard, { tilt: 1, tone: 'lilac', title: 'Analyse', replaces: 'PHPStan · Larastan', description: 'Type errors, no levels to juggle.', command: 'pun analyse', status: 'building', statusTone: 'zap' }),
          h(P.ToolCard, { tilt: -1, tone: 'gum', title: 'Lint', replaces: 'Rector · Mago', description: 'Code rules with autofix, one config.', command: 'pun lint --fix', status: 'designed', statusTone: 'lilac' }),
          h(P.ToolCard, { tilt: 1, tone: 'mint', letter: 'E', title: 'Editor', replaces: 'format-on-save plugins', description: 'One LSP for VS Code, Neovim and PhpStorm.', command: 'pun lsp', status: 'ready' }))),
      h('section', { className: 'lp-sec lp-race' },
        h('div', null,
          h('p', { className: 'pun-kicker' }, 'laravel/framework, formatted'),
          h('h2', { className: 'pun-h1' }, 'Blink and', h('br'), 'it’s done.'),
          h('div', { className: 'lp-mega' }, '51', h('sup', null, '×'))),
        h(P.Benchmark, { title: 'pun format vs pinned Pint', caption: 'laravel/framework, whole repo', href: '#', rows: [
          { label: 'Pint', sub: 'PHP', seconds: 190, tone: 'slow' },
          { label: 'pun', sub: 'cold', seconds: 3.7, tone: 'zap' },
          { label: 'pun', sub: 'warm cache', seconds: 0.07, tone: 'gum' }] })),
      h('section', { className: 'lp-sec' },
        h('p', { className: 'pun-kicker' }, 'parity, not “close enough”'),
        h('h2', { className: 'pun-h1' }, 'Same bytes as Pint.'),
        h('div', { className: 'lp-parity' },
          h(P.CodeBlock, { title: 'pint --test', meta: 'PHP', lines: ['@@ -1,3 +1,3 @@', ' <?php', '-$a = array( 1 );', '+$a = [1];'] }),
          h(P.Burst, { tone: 'zap', sub: 'identical' }, '='),
          h(P.CodeBlock, { title: 'pun format --test', meta: 'Rust', lines: ['@@ -1,3 +1,3 @@', ' <?php', '-$a = array( 1 );', '+$a = [1];'] }))),
      h(P.StickerPanel, { tone: 'gum', className: 'lp-cta' },
        h('h2', { className: 'pun-h1' }, 'Stop waiting', h('br'), 'on your tools.'),
        h('div', { className: 'pun-row' }, h(P.Button, { variant: 'zap', arrow: true }, 'Get started'), h(P.Button, null, 'Star on GitHub'))),
      h('footer', { className: 'lp-foot' }, h('span', null, 'pun · MIT'), h('span', null, 'made for PHP people who hate waiting')));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Page));
</script>
</body>
</html>
