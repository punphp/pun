<!-- @dsCard group="Cards" height=290 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ToolCard</title></head>
<body>
<div id="root"></div>
<script>
  var P = window.Pun, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'pun-pad', style: { display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 22, paddingTop: 34 } },
    h(P.ToolCard, { tilt: -1, tone: 'zap', title: 'Format', replaces: 'Pint · PHP-CS-Fixer', description: 'Pint-identical bytes, about 50\u00d7 faster.', command: 'pun format', status: 'ready' }),
    h(P.ToolCard, { tilt: 1, tone: 'lilac', title: 'Analyse', replaces: 'PHPStan · Larastan', description: 'Type errors, no levels to juggle.', command: 'pun analyse', status: 'building', statusTone: 'zap' }),
    h(P.ToolCard, { tilt: -1, tone: 'gum', title: 'Lint', replaces: 'Rector · Mago', description: 'Code rules with autofix, one config.', command: 'pun lint --fix', status: 'designed', statusTone: 'lilac' }),
    h(P.ToolCard, { tilt: 1, tone: 'mint', title: 'Migrate', replaces: 'hand-editing configs', description: 'pint.json, phpstan.neon, rector.php become one file.', command: 'pun migrate', status: 'ready' })));
</script>
</body>
</html>
