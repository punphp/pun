<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Button</title></head>
<body>
<div id="root"></div>
<script>
  var P = window.Pun, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'pun-row pun-pad' },
    h(P.Button, { variant: 'zap', arrow: true }, 'Get started'),
    h(P.Button, null, 'Read the docs'),
    h(P.Button, { variant: 'gum' }, 'Star on GitHub'),
    h(P.Button, { variant: 'ink' }, 'Benchmarks'),
    h(P.Button, { variant: 'zap', size: 'sm' }, 'Install')));
</script>
</body>
</html>
