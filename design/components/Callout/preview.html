<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Callout</title></head>
<body>
<div id="root"></div>
<script>
  var P = window.Pun, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'pun-pad pun-stack', style: { maxWidth: 680 } },
    h(P.Callout, { tone: 'tip', title: 'Already using Pint?' }, 'Pun reads your pint.json as is. Run ', h('code', null, 'pun format --test'), ' and expect zero changes.'),
    h(P.Callout, { tone: 'note', title: 'pint alias' }, 'Invoked as ', h('code', null, 'pint'), ', Pun behaves exactly like Pint and ignores pun.toml.'),
    h(P.Callout, { tone: 'warn', title: 'Unported rules' }, 'If a rule has no native port, Pun runs the file through the real PHP-CS-Fixer. ', h('code', null, '--explain'), ' says why.')));
</script>
</body>
</html>
