<head><meta charset="utf-8"><title>CodeBlock</title></head>
<body>
<div id="root"></div>
<script>
  var P = window.Pun, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'pun-pad', style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 24 } },
    h(P.CodeBlock, { title: 'pint --test', meta: 'PHP', lines: ['@@ -1,3 +1,3 @@', ' <?php', '-$a = array( 1 );', '+$a = [1];'] }),
    h(P.CodeBlock, { dots: true, title: 'terminal', meta: 'zsh', lines: ['$ pun format --test', '# laravel/framework', '\u2713 output matches Pint byte-for-byte', '!3.7 s cold \u00b7 0.07 s warm'] })));
</script>
</body>
