<!-- @dsCard group="Pages" height=1500 width=1200 page subtitle="A docs page: sidebar, article, on-this-page" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Docs page</title>
<style>
  .dp-top { display: flex; align-items: center; justify-content: space-between; gap: var(--space-6); padding: 16px var(--space-8); border-bottom: var(--stroke) solid var(--outline); background: var(--card); }
  .dp-search { flex: 1; max-width: 420px; display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border: var(--stroke-thin) solid var(--outline); border-radius: var(--radius-pill); background: var(--paper); color: var(--ink-3); font: 500 13px/1 var(--font-mono); }
  .dp-search kbd { font: 600 11px/1 var(--font-mono); padding: 4px 7px; border: var(--stroke-thin) solid var(--outline); border-radius: var(--radius-xs); background: var(--card); color: var(--ink); }
  .dp { display: grid; grid-template-columns: 250px 1fr 200px; min-height: 1400px; }
  .dp-side { background: var(--paper-2); border-right: var(--stroke) solid var(--outline); padding: var(--space-8) var(--space-6); }
  .dp-side h4 { font: 600 11px/1 var(--font-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); margin: var(--space-8) 0 var(--space-3); }
  .dp-side h4:first-child { margin-top: 0; }
  .dp-side a { display: block; padding: 7px 12px; margin: 2px 0; border-radius: var(--radius-sm); color: var(--ink-2); text-decoration: none; font: 500 15px/1.3 var(--font-display); border: var(--stroke-thin) solid transparent; }
  .dp-side a.on { background: var(--zap); color: #17121F; border-color: var(--outline); box-shadow: var(--pop-sm); font-weight: 700; }
  .dp-side img { display: block; width: 150px; margin: var(--space-10) auto 0; }
  .dp-main { padding: var(--space-10) var(--space-14) var(--space-24); max-width: 820px; }
  .dp-crumb { font: 500 12px/1 var(--font-mono); color: var(--ink-3); margin-bottom: var(--space-4); }
  .dp-main h1 { margin: 0 0 var(--space-4); }
  .dp-main h2 { margin: var(--space-14) 0 var(--space-4); }
  .dp-main p { font-size: 16px; line-height: 1.65; color: var(--ink-2); margin: 0 0 var(--space-5); max-width: 68ch; }
  .dp-main code.inl { font: 500 .85em/1 var(--font-mono); background: var(--paper-2); border: 1px solid var(--hairline); border-radius: var(--radius-xs); padding: 2px 6px; color: var(--ink); }
  .dp-main .pun-code, .dp-main .pun-callout { margin: var(--space-6) 0; }
  .dp-table { width: 100%; border-collapse: separate; border-spacing: 0; border: var(--stroke) solid var(--outline); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--pop); background: var(--card); margin: var(--space-6) 0; }
  .dp-table th { text-align: left; font: 600 11px/1 var(--font-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); padding: 14px 18px; background: var(--paper-2); border-bottom: var(--stroke) solid var(--outline); }
  .dp-table td { padding: 13px 18px; border-bottom: 2px dashed var(--hairline); font-size: 14px; color: var(--ink-2); vertical-align: top; }
  .dp-table tr:last-child td { border-bottom: 0; }
  .dp-table td:first-child { font: 600 13px/1.4 var(--font-mono); color: var(--ink); white-space: nowrap; }
  .dp-next { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-5); margin-top: var(--space-14); }
  .dp-next a { display: block; padding: var(--space-5); border: var(--stroke) solid var(--outline); border-radius: var(--radius-lg); background: var(--card); box-shadow: var(--pop); text-decoration: none; color: var(--ink); }
  .dp-next small { display: block; font: 500 11px/1 var(--font-mono); color: var(--ink-3); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .06em; }
  .dp-next b { font: 800 20px/1.1 var(--font-display); }
  .dp-toc { padding: var(--space-10) var(--space-6); }
  .dp-toc h4 { font: 600 11px/1 var(--font-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); margin: 0 0 var(--space-3); }
  .dp-toc a { display: block; padding: 6px 0 6px 12px; border-left: var(--stroke-thin) solid var(--hairline); color: var(--ink-3); text-decoration: none; font-size: 14px; }
  .dp-toc a.on { border-left-color: var(--outline); color: var(--ink); font-weight: 700; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var P = window.Pun, h = React.createElement;
  var dark = document.documentElement.getAttribute('data-theme') === 'dark';
  var WORDMARK = dark ? '../../assets/Logos/pun-wordmark-reverse.svg' : '../../assets/Logos/pun-wordmark.svg';
  var MASCOT = '../../assets/Mascot/pun-sprinter-512.png';
  function side(group, items, on) { return [h('h4', { key: group }, group)].concat(items.map(function (t) { return h('a', { key: t, href: '#', className: t === on ? 'on' : '' }, t); })); }
  function Docs() {
    return h('div', null,
      h('div', { className: 'dp-top' },
        h('img', { src: WORDMARK, alt: 'pun', height: 34 }),
        h('div', { className: 'dp-search' }, h('span', null, 'Search the docs'), h('kbd', null, '⌘K')),
        h('div', { className: 'pun-row', style: { gap: 12 } }, h(P.Tag, { tone: 'mint' }, 'v0.1'), h(P.Button, { size: 'sm' }, 'GitHub'))),
      h('div', { className: 'dp' },
        h('aside', { className: 'dp-side' },
          side('Get started', ['Introduction', 'Installation', 'Quickstart'], ''),
          side('Commands', ['pun format', 'pun lint', 'pun analyse', 'pun check', 'pun migrate'], 'pun format'),
          side('Configuration', ['pint.json', 'pun.toml', 'Extra rules'], ''),
          side('Guides', ['Migrating from Pint', 'CI'], ''),
          h('img', { src: MASCOT, alt: '' })),
        h('main', { className: 'dp-main' },
          h('div', { className: 'dp-crumb' }, 'Commands / pun format'),
          h('h1', { className: 'pun-h1' }, 'pun format'),
          h('p', { style: { fontSize: 20, color: 'var(--ink-2)' } }, 'Formats your project exactly like Pint, byte for byte, only much faster.'),
          h(P.CodeBlock, { dots: true, title: 'terminal', meta: 'zsh', lines: ['$ pun format              # fix the project, like pint', '$ pun format --test       # check only, exits 1 if anything would change', '$ pun format app/Models   # specific paths'] }),
          h(P.Callout, { tone: 'tip', title: 'Already using Pint?' }, 'Pun reads your ', h('code', null, 'pint.json'), ' as is. Pint’s flags work too, so most projects switch by changing one word in CI.'),
          h('h2', { className: 'pun-h2' }, 'Flags'),
          h('p', null, 'Every Pint flag behaves the same way. These are the ones you will reach for most.'),
          h('table', { className: 'dp-table' },
            h('thead', null, h('tr', null, h('th', null, 'Flag'), h('th', null, 'What it does'))),
            h('tbody', null,
              [['--test', 'Check only. Exits 1 if any file would change.'],
               ['--dirty', 'Only files with uncommitted changes.'],
               ['--diff=main', 'Only files that differ from a branch.'],
               ['--blade', 'Also format Blade templates.'],
               ['--watch', 'Re-format files as they change.'],
               ['--explain', 'Say why a rule runs through PHP-CS-Fixer.']].map(function (r) { return h('tr', { key: r[0] }, h('td', null, r[0]), h('td', null, r[1])); }))),
          h('h2', { className: 'pun-h2' }, 'Unported rules'),
          h('p', null, 'If an enabled rule has no native port yet, or the project uses ', h('code', { className: 'inl' }, '.php-cs-fixer.php'), ' with custom fixers, Pun hands those files to the real PHP-CS-Fixer in long-lived workers. Output stays identical to Pint.'),
          h(P.Callout, { tone: 'warn', title: 'Needs PHP for those rules' }, 'Delegated rules use the project’s ', h('code', null, 'vendor/laravel/pint'), '. Pass ', h('code', null, '--native-only'), ' to skip them and list what was skipped.'),
          h('div', { className: 'dp-next' },
            h('a', { href: '#' }, h('small', null, '← Previous'), h('b', null, 'Quickstart')),
            h('a', { href: '#', style: { textAlign: 'right' } }, h('small', null, 'Next →'), h('b', null, 'pun lint')))),
        h('nav', { className: 'dp-toc' }, h('h4', null, 'On this page'), h('a', { href: '#', className: 'on' }, 'Usage'), h('a', { href: '#' }, 'Flags'), h('a', { href: '#' }, 'Unported rules'))));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Docs));
</script>
</body>
</html>
