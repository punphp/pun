<!doctype html>

<style>

  .art { position:absolute; top:0; left:480px; width:480px; height:288px; }

  .dot { fill:#17121F; opacity:.15; }
  .words { position:absolute; left:var(--space-10); bottom:var(--space-10); max-width:440px; }
  .name { margin:0; font-size:120px; line-height:.9; font-weight:800; letter-spacing:-.05em; color:var(--ink); }
