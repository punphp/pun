[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/punphp/pun"

[workspace.dependencies]
pun-tokens = { path = "crates/pun-tokens", package = "punphp-tokens" }
pun-fixers = { path = "crates/pun-fixers", package = "punphp-fixers" }
pun-format = { path = "crates/pun-format", package = "punphp-format" }
pun-config = { path = "crates/pun-config", package = "punphp-config" }
pun-workspace = { path = "crates/pun-workspace", package = "punphp-workspace" }
mago-syntax = "=1.57.0"
mago-database = "=1.57.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = { version = "0.9", features = ["preserve_order"] }
clap = { version = "4", features = ["derive"] }
rayon = "1"
anyhow = "1"
similar = "2"
ignore = "0.4"
pcre2 = "0.2"
walkdir = "2"
mago-allocator = "=1.57.0"
mago-span = "=1.57.0"
mago-linter = "=1.57.0"
mago-names = "=1.57.0"
mago-reporting = "=1.57.0"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
pun-delegate = { path = "crates/pun-delegate", package = "punphp-delegate" }
notify = "8"
lsp-server = "0.10"
lsp-types = "0.97"
pun-phpstan = { path = "crates/pun-phpstan", package = "punphp-phpstan" }
indexmap = "2"
libc = "0.2"
# pun-lsp: PHPantom main (mago =1.57.0; release 0.11.1 still pins =1.47.5). No mimalloc: it would become Pun's global allocator.
phpantom_lsp = { git = "https://github.com/PHPantom-dev/phpantom_lsp", rev = "86e6c49d4", default-features = false }
tower-lsp = "0.20"
tower = "0.4"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
crossbeam-channel = "0.5"
# pun-analyse (Phase 2 M2.3)
mago-codex = "=1.57.0"
mago-analyzer = "=1.57.0"
mago-prelude = { version = "=1.57.0", features = ["build"] }
mago-php-version = "=1.57.0"
mago-word = "=1.57.0"
pun-analyse = { path = "crates/pun-analyse", package = "punphp-analyse" }

[profile.release]
lto = "thin"
codegen-units = 4

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Benchmarks and `perf`: release speed with line tables, cheap to build on a small box
# (`CARGO_BUILD_JOBS=1 cargo build --profile profiling -p punphp`).
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
lto = false
codegen-units = 16
