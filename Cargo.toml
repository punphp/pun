[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/shipfastlabs/pun"

[workspace.dependencies]
pun-tokens = { path = "crates/pun-tokens" }
pun-fixers = { path = "crates/pun-fixers" }
pun-format = { path = "crates/pun-format" }
pun-config = { path = "crates/pun-config" }
pun-workspace = { path = "crates/pun-workspace" }
mago-syntax = "=1.57.0"
mago-database = "=1.57.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.9"
clap = { version = "4", features = ["derive"] }
rayon = "1"
anyhow = "1"
similar = "2"
ignore = "0.4"

[profile.release]
lto = "thin"
codegen-units = 4
