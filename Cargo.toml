[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["third_party/mago-analyzer", "third_party/mago-codex", "third_party/mago-syntax", "third_party/mago-phpdoc-syntax"]

[patch.crates-io]
mago-analyzer = { path = "third_party/mago-analyzer" }
mago-codex = { path = "third_party/mago-codex" }
mago-syntax = { path = "third_party/mago-syntax" }
mago-phpdoc-syntax = { path = "third_party/mago-phpdoc-syntax" }

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/punphp/pun"
homepage = "https://github.com/punphp/pun"
keywords = ["php", "formatter", "linter", "static-analysis", "laravel"]
categories = ["development-tools"]
# Pun ships only as the punphp/pun Composer package (composer/), never to crates.io.
publish = false
# The Mago crates need rustc 1.99.
rust-version = "1.99"

[workspace.dependencies]
pun-tokens = { path = "crates/pun-tokens", package = "punphp-tokens" }
pun-fixers = { path = "crates/pun-fixers", package = "punphp-fixers" }
pun-format = { path = "crates/pun-format", package = "punphp-format" }
pun-config = { path = "crates/pun-config", package = "punphp-config" }
pun-workspace = { path = "crates/pun-workspace", package = "punphp-workspace" }
mago-syntax = "=1.57.0"
mago-database = "=1.57.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = { version = "0.9", features = ["preserve_order"] }
clap = { version = "4", features = ["derive"] }
rayon = "1"
bitflags = "2"
anyhow = "1"
similar = "2"
pcre2 = "0.2"
regex = "1"
regex-automata = "0.4"
walkdir = "2"
mago-allocator = "=1.57.0"
mago-span = "=1.57.0"
mago-names = "=1.57.0"
mago-phpdoc-syntax = "=1.57.0"
mago-reporting = "=1.57.0"
notify = "8"
pun-phpstan = { path = "crates/pun-phpstan", package = "punphp-phpstan" }
indexmap = "2"
libc = "0.2"
mago-codex = "=1.57.0"
mago-analyzer = "=1.57.0"
mago-prelude = { version = "=1.57.0", features = ["build"] }
mago-php-version = "=1.57.0"
mago-word = "=1.57.0"
pun-analyse = { path = "crates/pun-analyse", package = "punphp-analyse" }
# `pun migrate`'s checklist; no editor/password/fuzzy features.
dialoguer = { version = "0.12", default-features = false }
# Env-only: the default `process-tree` feature (sysinfo) adds ~12 ms per start and finds agents up the process tree.
agent-detector = { version = "=0.2.1", default-features = false }
pun-problem = { path = "crates/pun-problem", package = "punphp-problem" }
mago-syntax-core = "=1.57.0"
pun-lint = { path = "crates/pun-lint", package = "punphp-lint" }
# pun-analyse: the on-demand autoload index
foldhash = "0.2"
pcre2-sys = "0.2"
# pun-cli's `pprof` feature: an in-process sampling profiler.
pprof = { version = "0.15", default-features = false }
# `pun analyse --format=gitlab`: PHPStan's sha256 fingerprints.
sha2 = "0.11"
# `pun format --format=gitlab`: PHP-CS-Fixer's md5 fingerprints.
md-5 = "0.11"
# Local phar:// member stat: archive indexes, gzip containers and PHAR signatures only.
zip = { version = "9.1.1", default-features = false }
tar = { version = "0.4.46", default-features = false }
flate2 = "1"
sha1 = "0.11"
# `pun install`: Packagist metadata and dist downloads over HTTPS (rustls with the Mozilla roots, gzip).
ureq = "3.5"
pun-packages = { path = "crates/pun-packages", package = "punphp-packages" }

# The shared lint policy; every crate opts in with `[lints] workspace = true`. Lints that fight the
# function-by-function upstream ports are allowed; the rest warn, and CI denies warnings.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Conventions: upstream ports keep PHP's names, index loops and casts.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
too_many_lines = "allow"
many_single_char_names = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
similar_names = "allow"
unused_self = "allow"
enum_glob_use = "allow"
# Port shape: rules mirror upstream PHP function by function (switches, flags, argument lists, early returns).
wildcard_imports = "allow"
items_after_statements = "allow"
match_same_arms = "allow"
single_match_else = "allow"
match_bool = "allow"
if_not_else = "allow"
option_option = "allow"
needless_pass_by_value = "allow"
format_push_string = "allow"
format_collect = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
struct_field_names = "allow"
type_complexity = "allow"
too_many_arguments = "allow"
unreadable_literal = "allow"
match_wildcard_for_single_variants = "allow"
large_enum_variant = "allow"
# Style only: `Default::default()` reads fine, and method-path closures need the full `Type::method` spelling.
default_trait_access = "allow"
redundant_closure_for_method_calls = "allow"
# Port shape, continued: conditions, signatures and control flow copy upstream's.
nonminimal_bool = "allow"
needless_continue = "allow"
unnecessary_wraps = "allow"
manual_let_else = "allow"
trivially_copy_pass_by_ref = "allow"
ref_option = "allow"
self_only_used_in_recursion = "allow"
map_unwrap_or = "allow"
float_cmp = "allow"
return_self_not_must_use = "allow"
# PHP compares extensions byte for byte, and token kinds are PHP's decimal constants.
case_sensitive_file_extension_comparisons = "allow"
decimal_bitwise_operands = "allow"
# `assert_eq!(x, [])` prints the unexpected items; `assert!(x.is_empty())` does not.
assert_is_empty = "allow"
# Counting bytes with a filter is fine without the bytecount crate.
naive_bytecount = "allow"
# Restriction lints worth having:
undocumented_unsafe_blocks = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
redundant_clone = "warn"
needless_collect = "warn"

# Tests and debug builds run Mago and the other dependencies optimized (about 1.8x on the analyse fixture suites),
# with line tables only, so the 170 analyse test binaries stay small; Pun's own crates stay unoptimized so they
# rebuild fast.
[profile.dev.package."*"]
opt-level = 2
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 4

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
# Symbols are 15% of the binary (75 MB to 64 MB on Linux x86_64). Panic messages keep their file and line.
strip = true

# Benchmarks and `perf`: release speed with line tables, cheap to build on a small box
# (`CARGO_BUILD_JOBS=1 cargo build --profile profiling -p punphp`).
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
lto = false
codegen-units = 16
