[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["third_party/mago-analyzer", "third_party/mago-codex"]

[patch.crates-io]
mago-analyzer = { path = "third_party/mago-analyzer" }
mago-codex = { path = "third_party/mago-codex" }

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/punphp/pun"
homepage = "https://github.com/punphp/pun"
keywords = ["php", "formatter", "pint", "laravel", "php-cs-fixer"]
categories = ["development-tools"]
# The Mago crates need rustc 1.99.
rust-version = "1.99"

[workspace.dependencies]
pun-tokens = { path = "crates/pun-tokens", package = "punphp-tokens" }
pun-fixers = { path = "crates/pun-fixers", package = "punphp-fixers" }
pun-format = { path = "crates/pun-format", package = "punphp-format" }
pun-config = { path = "crates/pun-config", package = "punphp-config" }
pun-workspace = { path = "crates/pun-workspace", package = "punphp-workspace" }
mago-syntax = "=1.57.0"
mago-database = "=1.57.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = { version = "0.9", features = ["preserve_order"] }
clap = { version = "4", features = ["derive"] }
rayon = "1"
anyhow = "1"
similar = "2"
ignore = "0.4"
pcre2 = "0.2"
walkdir = "2"
mago-allocator = "=1.57.0"
mago-span = "=1.57.0"
mago-linter = "=1.57.0"
mago-names = "=1.57.0"
mago-reporting = "=1.57.0"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
notify = "8"
pun-phpstan = { path = "crates/pun-phpstan", package = "punphp-phpstan" }
indexmap = "2"
libc = "0.2"
# pun-analyse (Phase 2 M2.3)
mago-codex = "=1.57.0"
mago-analyzer = "=1.57.0"
mago-prelude = { version = "=1.57.0", features = ["build"] }
mago-php-version = "=1.57.0"
mago-word = "=1.57.0"
pun-analyse = { path = "crates/pun-analyse", package = "punphp-analyse" }
# `pun migrate`'s checklist; no editor/password/fuzzy features.
dialoguer = { version = "0.12", default-features = false }
# Env-only: the default `process-tree` feature (sysinfo) adds ~12 ms per start and finds agents up the process tree.
agent-detector = { version = "=0.2.1", default-features = false }
pun-problem = { path = "crates/pun-problem", package = "punphp-problem" }
mago-syntax-core = "=1.57.0"
pun-lint = { path = "crates/pun-lint", package = "punphp-lint" }
# pun-analyse: the on-demand autoload index
foldhash = "0.2"
pcre2-sys = "0.2"
# pun-cli's `pprof` feature: an in-process sampling profiler.
pprof = { version = "0.15", default-features = false }
# `pun analyse --format=gitlab`: PHPStan's sha256 fingerprints.
sha2 = "0.11"
# `pun format --format=gitlab`: PHP-CS-Fixer's md5 fingerprints.
md-5 = "0.11"

# The shared lint policy (context/AUDIT.md item 28). A crate opts in with `[lints] workspace = true`. Lints with
# hundreds of hits that follow a convention are allowed; lints with few, real hits warn.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Conventions: upstream ports keep PHP's names, index loops and casts.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
too_many_lines = "allow"
many_single_char_names = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
similar_names = "allow"
unused_self = "allow"
enum_glob_use = "allow"
# Restriction lints worth having:
undocumented_unsafe_blocks = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
redundant_clone = "warn"
needless_collect = "warn"
naive_bytecount = "warn"

[profile.release]
lto = "thin"
codegen-units = 4

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Benchmarks and `perf`: release speed with line tables, cheap to build on a small box
# (`CARGO_BUILD_JOBS=1 cargo build --profile profiling -p punphp`).
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
lto = false
codegen-units = 16
