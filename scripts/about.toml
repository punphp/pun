# cargo-about configuration for THIRD_PARTY_LICENSES.md (scripts/gen-third-party-licenses.sh).
accepted = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "CC0-1.0", "Unlicense", "BSL-1.0", "MPL-2.0"]
# the four release targets (dist-workspace.toml)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-linux-musl"]
ignore-dev-dependencies = true
# Pun's own crates (publish = false) are under LICENSE
private = { ignore = true }
