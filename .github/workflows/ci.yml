name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push makes the older run's result useless.
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # No test reads debug info, and without it the workspace builds and links faster.
  CARGO_PROFILE_DEV_DEBUG: 0
  # The PCRE2 the release binaries bundle, not the runner's older system library.
  PCRE2_SYS_STATIC: 1

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          cache-on-failure: true
      - name: rule mapping and generated docs
        run: |
          python3 scripts/check-rule-mapping.py
          python3 scripts/test-rule-docs.py
          python3 scripts/gen-rule-docs.py --check
      # POSIX sh only: the installer runs under dash, BusyBox ash and macOS's sh.
      - name: shellcheck the installer
        run: shellcheck -s sh docs/public/install
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/oracle
      # pun-cli's tests run Pint's and Pun's Blade preflight with a Bun lock file.
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          cache-on-failure: true
      # pun-phpstan's corpus_configs reads these four projects' phpstan configs.
      - uses: actions/cache@v4
        with:
          path: |
            corpus/pinkary
            corpus/laravel-framework
            corpus/larastan
            corpus/laravel-pint
          key: corpus4-${{ hashFiles('corpus/manifest.toml', 'scripts/corpus.sh') }}
      - run: scripts/corpus.sh pinkary laravel-framework larastan laravel-pint
      # punphp-analyse's 170 test targets need about 56 GB of disk and 40 minutes on 8 cores, more than a hosted
      # runner has. Run them with scripts/analyse-tests.sh before a release.
      - run: cargo test --workspace --exclude punphp-analyse --locked

  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/oracle
      - uses: dtolnay/rust-toolchain@stable
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: parity
          cache-on-failure: true
      - uses: actions/cache@v4
        with:
          path: |
            corpus/pinkary
            corpus/laravel-framework
          key: corpus-${{ hashFiles('corpus/manifest.toml', 'scripts/corpus.sh') }}
      - run: scripts/corpus.sh pinkary laravel-framework
      - run: cargo build --locked -p punphp -p punphp-harness
      - run: target/debug/pun-harness format --corpus pinkary --corpus laravel-framework --diffs 20

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/oracle
      - uses: dtolnay/rust-toolchain@stable
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: parity
          cache-on-failure: true
      - uses: actions/cache@v4
        with:
          path: |
            corpus/pinkary
            corpus/laravel-framework
          key: corpus-${{ hashFiles('corpus/manifest.toml', 'scripts/corpus.sh') }}
      - run: scripts/corpus.sh pinkary laravel-framework
      # Pinkary's pint.json enables Pint/laravel_blade, which needs prettier.
      - run: npm install --prefix corpus/pinkary --no-audit --no-fund
      - run: cargo build --locked -p punphp
      # Fixed seeds, so a failure reproduces locally with the same command (scripts/fuzz-parity.sh header).
      # The four runs use separate scratch directories, so they run side by side.
      - run: |
          echo '{"preset": "laravel"}' > /tmp/laravel.json
          scripts/fuzz-parity.sh corpus/pinkary 1 app tests database config routes & pids=($!)
          scripts/fuzz-parity.sh corpus/pinkary 2 app tests database config routes & pids+=($!)
          FUZZ_CONFIG=/tmp/laravel.json scripts/fuzz-parity.sh corpus/laravel-framework 3 src/Illuminate/Support src/Illuminate/Collections & pids+=($!)
          FUZZ_CONFIG=/tmp/laravel.json scripts/fuzz-parity.sh corpus/laravel-framework 4 src/Illuminate/Database/Query tests/Support & pids+=($!)
          status=0; for pid in "${pids[@]}"; do wait "$pid" || status=1; done; exit $status
