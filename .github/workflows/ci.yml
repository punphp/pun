name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
      - name: rustfmt
        run: cargo fmt --all --check
      # ponytail: clippy reports but doesn't gate yet; add `-- -D warnings` once the cleanup pass lands.
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/oracle
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      # pun-phpstan's corpus_configs reads these four projects' phpstan configs.
      - run: sed -i 's#^url = "/home/forge/projects/pinkary.com"#url = "https://github.com/pinkary-project/pinkary.com.git"#' corpus/manifest.toml
      - uses: actions/cache@v4
        with:
          path: |
            corpus/pinkary
            corpus/laravel-framework
            corpus/larastan
            corpus/laravel-pint
          key: corpus4-${{ hashFiles('corpus/manifest.toml', 'scripts/corpus.sh') }}
      - run: scripts/corpus.sh pinkary laravel-framework larastan laravel-pint
      - run: cargo test --workspace --locked

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/oracle
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage
          cache-directories: target/coverage
      # pun-phpstan's corpus_configs reads these four projects' phpstan configs.
      - run: sed -i 's#^url = "/home/forge/projects/pinkary.com"#url = "https://github.com/pinkary-project/pinkary.com.git"#' corpus/manifest.toml
      - uses: actions/cache@v4
        with:
          path: |
            corpus/pinkary
            corpus/laravel-framework
            corpus/larastan
            corpus/laravel-pint
          key: corpus4-${{ hashFiles('corpus/manifest.toml', 'scripts/corpus.sh') }}
      - run: scripts/corpus.sh pinkary laravel-framework larastan laravel-pint
      - run: scripts/coverage.sh
      - if: always()
        run: cat docs/COVERAGE.md >> "$GITHUB_STEP_SUMMARY"

  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/oracle
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: parity
      # corpus/manifest.toml points pinkary at a local checkout; CI fetches the same commit upstream.
      - run: sed -i 's#^url = "/home/forge/projects/pinkary.com"#url = "https://github.com/pinkary-project/pinkary.com.git"#' corpus/manifest.toml
      - uses: actions/cache@v4
        with:
          path: |
            corpus/pinkary
            corpus/laravel-framework
          key: corpus-${{ hashFiles('corpus/manifest.toml', 'scripts/corpus.sh') }}
      - run: scripts/corpus.sh pinkary laravel-framework
      - run: cargo build --locked -p punphp -p punphp-harness
      - run: target/debug/pun-harness format --corpus pinkary --corpus laravel-framework --diffs 20

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/oracle
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: parity
      - run: sed -i 's#^url = "/home/forge/projects/pinkary.com"#url = "https://github.com/pinkary-project/pinkary.com.git"#' corpus/manifest.toml
      - uses: actions/cache@v4
        with:
          path: |
            corpus/pinkary
            corpus/laravel-framework
          key: corpus-${{ hashFiles('corpus/manifest.toml', 'scripts/corpus.sh') }}
      - run: scripts/corpus.sh pinkary laravel-framework
      # Pinkary's pint.json enables Pint/laravel_blade, which needs prettier.
      - run: npm install --prefix corpus/pinkary --no-audit --no-fund
      - run: cargo build --locked -p punphp
      # Fixed seeds, so a failure reproduces locally with the same command (scripts/fuzz-parity.sh header).
      - run: |
          scripts/fuzz-parity.sh corpus/pinkary 1 app tests database config routes
          scripts/fuzz-parity.sh corpus/pinkary 2 app tests database config routes
          echo '{"preset": "laravel"}' > /tmp/laravel.json
          FUZZ_CONFIG=/tmp/laravel.json scripts/fuzz-parity.sh corpus/laravel-framework 3 src/Illuminate/Support src/Illuminate/Collections
          FUZZ_CONFIG=/tmp/laravel.json scripts/fuzz-parity.sh corpus/laravel-framework 4 src/Illuminate/Database/Query tests/Support
