name: Oracle
description: PHP 8.5, Node, and the pinned Pint / PHP-CS-Fixer oracle in .oracle/ (scripts/oracle.sh), cached.
runs:
  using: composite
  steps:
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'
        tools: composer
        coverage: none
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - uses: actions/cache@v4
      with:
        path: .oracle
        key: oracle-${{ hashFiles('scripts/oracle.sh') }}
    - shell: bash
      run: scripts/oracle.sh
    # Blade fixture tests resolve prettier from crates/pun-fixers/node_modules.
    - shell: bash
      run: if [ -f crates/pun-fixers/package.json ]; then npm install --prefix crates/pun-fixers --no-audit --no-fund; fi
