[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# Ship third-party redistribution terms alongside the auto-included MIT license.
include = ["THIRD_PARTY_NOTICES.md"]
# CI backends to support
ci = "github"
# No installers or registries: Pun ships only as the punphp/pun Composer package (composer/bin/pun), which
# downloads these archives from the GitHub release.
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-linux-musl"]
# .tar.gz rather than .tar.xz: the Composer shim extracts with plain `tar xzf` (xz is missing on slim images)
unix-archive = ".tar.gz"
# No source tarball: .gitattributes keeps the Rust source out of `git archive` (it is the Composer package's archive)
source-tarball = false
