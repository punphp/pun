[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# Ship third-party redistribution terms alongside the auto-included MIT license.
include = ["THIRD_PARTY_NOTICES.md", "THIRD_PARTY_LICENSES.md"]
# CI backends to support
ci = "github"
# No dist installers or registries. Pun ships as the punphp/pun Composer package (composer/bin/pun) and as the
# release's install.sh, which .github/workflows/installer.yml stamps; both download these archives.
installers = []
global-artifacts-jobs = ["./installer"]
# Sigstore build provenance for the archives and install.sh, made where the release is created and checked by
# install.sh with `gh attestation verify`.
github-attestations = true
github-attestations-phase = "host"
github-attestations-filters = ["*.tar.gz", "install.sh"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-linux-musl"]
# .tar.gz rather than .tar.xz: the Composer shim extracts with plain `tar xzf` (xz is missing on slim images)
unix-archive = ".tar.gz"
# No source tarball: .gitattributes keeps the Rust source out of `git archive` (it is the Composer package's archive)
source-tarball = false
# Steps run before each build: the toolchain the workspace needs (the macOS image ships an older one) and a static
# PCRE2 on every target (pcre2-sys links Homebrew's dynamically when pkg-config finds it).
github-build-setup = "../build-setup.yml"

# GitHub's default arm64 macOS label for dist 0.33 is no longer offered.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"
