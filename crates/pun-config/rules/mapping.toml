switch-case-semicolon-to-colon = { group = "control-flow", fix = "safe", presets = ["laravel", "per", "psr12", "symfony"], ported = true, status = "decided", summary = "A case should be followed by a colon and not a semicolon." }
switch-case-space = { group = "control-flow", fix = "safe", presets = ["laravel", "per", "psr12", "symfony"], ported = true, status = "decided", summary = "Removes extra spaces between colon and case value." }
