phpdoc-order-by-value = { group = "phpdoc", fix = "safe", ported = false, status = "decided", summary = "Order PHPDoc tags by value." }
phpdoc-param-order = { group = "phpdoc", fix = "safe", ported = false, status = "decided", summary = "Orders all `@param` annotations in DocBlocks according to method signature." }
