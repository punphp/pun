"imports/no-leading-slash" = { fix = "safe", presets = ["laravel", "psr12"], ported = true, status = "decided", summary = "Remove leading slashes in `use` clauses." }
"imports/no-unneeded-alias" = { fix = "safe", presets = ["laravel"], ported = true, status = "decided", summary = "Imports should not be aliased as the same name." }
"imports/ordered" = { fix = "safe", presets = ["laravel", "psr12"], ported = true, status = "decided", summary = "Ordering `use` statements." }
"imports/single-per-statement" = { fix = "safe", presets = ["laravel", "psr12"], ported = true, status = "decided", summary = "There MUST be one use keyword per declaration." }
"laravel/blade" = { fix = "safe", ported = true, status = "decided", summary = "Formats Blade templates (Pint 1.30, Prettier + prettier-plugin-blade)." }
"operators/binary-spacing" = { fix = "safe", presets = ["laravel", "psr12"], ported = true, status = "decided", summary = "Binary operators should be surrounded by space as configured." }
