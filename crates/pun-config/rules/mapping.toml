# Pun rule placement and upstream mapping. Design: context/RULES.md. Checked by scripts/check-rule-mapping.py.
# Drives `pun migrate` (upstream config, ignores and baselines -> pun.toml), `pun explain <rule>` (upstream names and
# docs links) and the generated docs page "Coming from Pint / PHPStan / Rector".
#
# [rules.<command>]  every Pun rule. ID = "<command>.<name>"; names are unique across all commands.
#   group     rule group (data only, not part of the ID)
#   fix       safe | unsafe | mixed | none  (format: always safe; mixed = safe where analysis proves it, else unsafe)
#   severity  default severity when enabled (lint/analyse): error | warn | info
#   tier      (lint/analyse) lowest preset tier that enables it: essential | recommended | strict | pedantic, or none
#             (opt-in only: configurable codemods, one-time upgrade codemods, the losing side of a [meta] conflict).
#             Tiers are cumulative; see context/RULES.md §5
#   presets   format: Pint presets that enable it. lint/analyse: the add-on (laravel | pest | phpunit) the rule also
#             needs; it runs when that add-on is on and the selected tier includes its tier
#   fixed_by  (analyse) lint rules whose fix resolves this report; `pun check` shows one diagnostic
#   gated_by  php-version / laravel-version: only runs when [php] version / the locked Laravel version allows
#   ported    implemented in Pun today
#   status    decided
#   aliases   earlier Pun names (the auto-derived names before the naming pass); configs and ignores using them still work
#   merged    every upstream source of a rule that the naming pass built by merging several rules ("tool:id")
#   pun_only  the rule has no upstream source (Pun's own rule)
# [upstream.<tool>]  every upstream rule -> pun (rule ID), or drop / unsupported with a reason. The key is the exact
#   upstream ID: CS-Fixer rule name, Rector class short name (FQCN in `class`), PHPStan identifier, Mago rule code.
#   class     (Rector, Pest) fully qualified class name
#   options   how upstream options carry over
#   status    decided

[meta]
schema = 1
upstream = { php-cs-fixer = "3.95.17", pint = "1.30 (oracle .oracle/pint)", rector = "2.6.1", rector-laravel = "driftingly/rector-laravel 2.5.0", pest-plugin-rector = "5.x-dev@8c1b780", phpstan = "2.2.7", phpstan-strict-rules = "2.0.12", phpstan-deprecation-rules = "2.0.5", larastan = "3.10.0", mago = "1.57.0" }
tiers = ["essential", "recommended", "strict", "pedantic"]
addons = ["laravel", "pest", "phpunit"]
# [analyse] type switches each tier turns on (cumulative); PHPStan levels 7-10
tier_switches = { strict = ["union-types", "nullables"], pedantic = ["explicit-mixed", "implicit-mixed"] }
conflicts = [
  ["lint.prefer-named-data-provider-keys", "lint.no-named-data-provider-keys"],
  ["lint.prefer-chained-expect", "lint.no-and-expectation"],
  ["format.single-import-per-statement", "format.group-import"],
  ["format.simplified-null-return", "lint.require-consistent-return"],
  ["lint.prefer-short-ternary", "lint.no-short-ternary"],
]

[rules.format]
align-multiline-comment = { group = "phpdoc", fix = "safe", presets = ["symfony"], ported = true, status = "decided", summary = "Each line of multi-line DocComments must have an asterisk [PSR-5] and must be aligned with the first one." }
array-indentation = { group = "whitespace", fix = "safe", presets = ["laravel", "per", "symfony"], ported = true, status = "decided", summary = "Each element of an array must be indented exactly once." }
array-syntax = { group = "syntax", fix = "safe", presets = ["laravel", "per", "symfony"], ported = true, status = "decided", summary = "PHP arrays should be declared using the configured syntax." }
assign-null-coalescing-to-coalesce-equal = { group = "operators", fix = "safe", ported = false, status = "decided", summary = "Use the null coalescing assignment operator `??=` where possible." }
attribute-block-no-spaces = { group = "syntax", fix = "safe", presets = ["per", "symfony"], ported = false, status = "decided", summary = "Remove spaces before and after the attributes block." }
attribute-empty-parentheses = { group = "syntax", fix = "safe", ported = false, status = "decided", summary = "PHP attributes declared without arguments must (not) be followed by empty parentheses." }
backtick-to-shell-exec = { group = "syntax", fix = "safe", presets = ["symfony"], ported = true, status = "decided", summary = "Converts backtick operators to `shell_exec` calls." }
binary-operator-spaces = { group = "operators", fix = "safe", presets = ["laravel", "per", "psr12", "symfony"], ported = true, status = "decided", summary = "Binary operators should be surrounded by space as configured." }
blank-line-after-namespace = { group = "imports", fix = "safe", presets = ["laravel", "per", "psr12", "symfony"], ported = true, status = "decided", summary = "There MUST be one blank line after the namespace declaration." }
blank-line-after-opening-tag = { group = "syntax", fix = "safe", presets = ["laravel", "per", "psr12", "symfony"], ported = true, status = "decided", summary = "Ensure there is no code on the same line as the PHP open tag and it is followed by a blank line." }
blank-line-before-statement = { group = "whitespace", fix = "safe", presets = ["laravel", "symfony"], ported = true, status = "decided", summary = "An empty line feed must precede any configured statement." }
blank-line-between-import-groups = { group = "whitespace", fix = "safe", presets = ["laravel", "per", "psr12", "symfony"], ported = true, status = "decided", summary = "Putting blank lines between `use` statement groups." }
blank-lines-before-namespace = { group = "imports", fix = "safe", presets = ["laravel", "per", "psr12", "symfony"], ported = true, status = "decided", summary = "Controls blank lines before a namespace declaration." }
braces-position = { group = "syntax", fix = "safe", presets = ["laravel", "per", "psr12", "symfony"], ported = true, status = "decided", summary = "Braces must be placed as configured." }
cast-spaces = { group = "syntax", fix = "safe", presets = ["laravel", "per", "symfony"], ported = true, status = "decided", summary = "A single space or none should be between cast and variable." }
class-attributes-separation = { group = "classes", fix = "safe", presets = ["laravel", "symfony"], ported = true, status = "decided", summary = "Class, trait and interface elements must be separated with one or none blank line." }
class-definition = { group = "classes", fix = "safe", presets = ["laravel", "per", "psr12", "symfony"], ported = true, status = "decided", summary = "Whitespace around the keywords of a class, trait, enum or interfaces definition should be one space." }
class-reference-name-casing = { group = "casing", fix = "safe", presets = ["symfony"], ported = true, status = "decided", summary = "When referencing an internal class it must be written using the correct casing." }
clean-namespace = { group = "imports", fix = "safe", presets = ["laravel", "symfony"], ported = true, status = "decided", summary = "Namespace must not contain spacing, comments or PHPDoc." }
combine-consecutive-issets = { group = "syntax", fix = "safe", ported = true, status = "decided", summary = "Using `isset($var) &&` multiple times should be done in one call." }
combine-consecutive-unsets = { group = "syntax", fix = "safe", ported = true, status = "decided", summary = "Calling `unset` on multiple items should be done in one call." }
compact-nullable-type-declaration = { group = "whitespace", fix = "safe", presets = ["laravel", "per", "psr12", "symfony"], ported = true, status = "decided", summary = "Remove extra spaces in a nullable type declaration." }
concat-space = { group = "operators", fix = "safe", presets = ["laravel", "per", "symfony"], ported = true, status = "decided", summary = "Concatenation should be spaced according to configuration." }
constant-case = { group = "casing", fix = "safe", presets = ["laravel", "per", "psr12", "symfony"], ported = true, status = "decided", summary = "The PHP constants `true`, `false`, and `null` MUST be written using the correct casing." }
control-structure-braces = { group = "control-flow", fix = "safe", presets = ["laravel", "per", "psr12", "symfony"], ported = true, status = "decided", summary = "The body of each control structure MUST be enclosed within braces." }
control-structure-continuation-position = { group = "control-flow", fix = "safe", presets = ["laravel", "per", "psr12", "symfony"], ported = true, status = "decided", summary = "Control structure continuation keyword must be on the configured line." }
declare-equal-normalize = { group = "syntax", fix = "safe", presets = ["laravel", "per", "psr12", "symfony"], ported = true, status = "decided", summary = "Equal sign in declare statement should be surrounded by spaces or not following configuration." }
declare-parentheses = { group = "syntax", fix = "safe", presets = ["laravel", "symfony"], ported = true, status = "decided", summary = "There must not be spaces around `declare` statement parentheses." }
doctrine-annotation-array-assignment = { group = "phpdoc", fix = "safe", ported = false, status = "decided", summary = "Doctrine annotations must use configured operator for assignment in arrays." }
doctrine-annotation-braces = { group = "phpdoc", fix = "safe", ported = false, status = "decided", summary = "Doctrine annotations without arguments must use the configured syntax." }
doctrine-annotation-indentation = { group = "phpdoc", fix = "safe", ported = false, status = "decided", summary = "Doctrine annotations must be indented with four spaces." }
doctrine-annotation-spaces = { group = "phpdoc", fix = "safe", ported = false, status = "decided", summary = "Fixes spaces in Doctrine annotations." }
echo-tag-syntax = { group = "syntax", fix = "safe", presets = ["symfony"], ported = false, status = "decided", summary = "Replaces short-echo `<?=` with long format `<?php echo`/`<?php print` syntax, or vice-versa." }
elseif = { group = "control-flow", fix = "safe", presets = ["laravel", "per", "psr12", "symfony"], ported = true, status = "decided", summary = "The keyword `elseif` should be used instead of `else if` so that all control keywords look like single words." }
empty-loop-body = { group = "control-flow", fix = "safe", presets = ["symfony"], ported = false, status = "decided", summary = "Empty loop-body must be in configured style." }
empty-loop-condition = { group = "control-flow", fix = "safe", presets = ["symfony"], ported = false, status = "decided", summary = "Empty loop-condition must be in configured style." }
encoding = { group = "syntax", fix = "safe", presets = ["laravel", "per", "psr12", "symfony"], ported = true, status = "decided", summary = "PHP code MUST use only UTF-8 without BOM (remove BOM)." }
explicit-indirect-variable = { group = "syntax", fix = "safe", ported = false, status = "decided", summary = "Add curly braces to indirect variables to make them clear to understand." }
explicit-string-variable = { group = "strings", fix = "safe", ported = false, status = "decided", summary = "Converts implicit variables into explicit ones in double-quoted strings or heredoc syntax." }
full-opening-tag = { group = "syntax", fix = "safe", presets = ["laravel", "per", "psr12", "symfony"], ported = true, status = "decided", summary = "PHP code must use the long `<?php` tags or short-echo `<?=` tags and not other tag variations." }
fully-qualified-strict-types = { group = "imports", fix = "safe", presets = ["laravel", "symfony"], ported = true, status = "decided", summary = "Removes the leading part of fully qualified symbol references if a given symbol is imported or belongs to the current namespace." }
function-declaration = { group = "functions", fix = "safe", presets = ["laravel", "per", "psr12", "symfony"], ported = true, status = "decided", summary = "Spaces should be properly placed in a function declaration." }
general-attribute-remove = { group = "syntax", fix = "safe", ported = false, status = "decided", summary = "Removes configured attributes by their respective FQN." }
general-phpdoc-annotation-remove = { group = "phpdoc", fix = "safe", ported = false, status = "decided", summary = "Removes configured annotations from PHPDoc." }
general-phpdoc-tag-rename = { group = "phpdoc", fix = "safe", presets = ["laravel", "symfony"], ported = true, status = "decided", summary = "Renames PHPDoc tags." }
global-namespace-import = { group = "imports", fix = "safe", presets = ["symfony"], ported = true, status = "decided", summary = "Imports or fully qualifies global classes/functions/constants." }
group-import = { group = "imports", fix = "safe", ported = false, status = "decided", summary = "There MUST be group use for the same namespaces." }
header-comment = { group = "comments", fix = "safe", ported = false, status = "decided", summary = "Add, replace or remove header comment." }
heredoc-closing-marker = { group = "strings", fix = "safe", ported = false, status = "decided", summary = "Unify `heredoc` or `nowdoc` closing marker." }
heredoc-indentation = { group = "whitespace", fix = "safe", ported = false, status = "decided", summary = "Heredoc/nowdoc content must be properly indented." }
heredoc-to-nowdoc = { group = "strings", fix = "safe", presets = ["laravel"], ported = true, status = "decided", summary = "Convert `heredoc` to `nowdoc` where possible." }
include = { group = "control-flow", fix = "safe", presets = ["laravel", "symfony"], ported = true, status = "decided", summary = "Include/Require and file path should be divided with a single space. File path should not be placed within parentheses." }
increment-style = { group = "operators", fix = "safe", presets = ["laravel", "symfony"], ported = true, status = "decided", summary = "Pre- or post-increment and decrement operators should be used if possible." }
indentation-type = { group = "whitespace", fix = "safe", presets = ["laravel", "per", "psr12", "symfony"], ported = true, status = "decided", summary = "Code MUST use configured indentation type." }
integer-literal-case = { group = "casing", fix = "safe", presets = ["laravel", "symfony"], ported = true, status = "decided", summary = "Integer literals must be in correct case." }
lambda-not-used-import = { group = "functions", fix = "safe", presets = ["laravel", "symfony"], ported = true, status = "decided", summary = "Lambda must not import variables it doesn't use." }
laravel-blade = { group = "blade", fix = "safe", ported = true, status = "decided", summary = "Formats Blade templates (Pint 1.30, Prettier + prettier-plugin-blade)." }
line-ending = { group = "whitespace", fix = "safe", presets = ["laravel", "per", "psr12", "symfony"], ported = true, status = "decided", summary = "All PHP files must use same line ending." }
linebreak-after-opening-tag = { group = "syntax", fix = "safe", presets = ["laravel", "symfony"], ported = true, status = "decided", summary = "Ensure there is no code on the same line as the PHP open tag." }
list-syntax = { group = "syntax", fix = "safe", presets = ["laravel"], ported = true, status = "decided", summary = "List (`array` destructuring) assignment should be declared using the configured syntax." }
lowercase-cast = { group = "syntax", fix = "safe", presets = ["laravel", "per", "psr12", "symfony"], ported = true, status = "decided", summary = "Cast should be written in lower case." }
lowercase-keywords = { group = "casing", fix = "safe", presets = ["laravel", "per", "psr12", "symfony"], ported = true, status = "decided", summary = "PHP keywords MUST be in lower case." }
lowercase-static-reference = { group = "casing", fix = "safe", presets = ["laravel", "per", "psr12", "symfony"], ported = true, status = "decided", summary = "Class static references `self`, `static` and `parent` MUST be in lower case." }
magic-constant-casing = { group = "casing", fix = "safe", presets = ["laravel", "symfony"], ported = true, status = "decided", summary = "Magic constants should be referred to using the correct casing." }
magic-method-casing = { group = "casing", fix = "safe", presets = ["laravel", "symfony"], ported = true, status = "decided", summary = "Magic method definitions and calls must be using the correct casing." }
method-argument-space = { group = "functions", fix = "safe", presets = ["laravel", "per", "psr12", "symfony"], ported = true, status = "decided", summary = "In method arguments and method call, there MUST NOT be a space before each comma and there MUST be one space after each comma. Argument lists MAY be split across multiple lines, where each subsequent line is indented once. When doing so, the first item in the list MUST be on the next line, and there MUST be only one argument per line." }
method-chaining-indentation = { group = "whitespace", fix = "safe", presets = ["laravel"], ported = true, status = "decided", summary = "Method chaining MUST be properly indented. Method chaining with different levels of indentation is not supported." }
modifier-keywords = { group = "classes", fix = "safe", presets = ["laravel", "per", "psr12", "symfony"], ported = true, status = "decided", summary = "Classes, constants, properties, and methods MUST have visibility declared, and keyword modifiers MUST be in the following order: inheritance modifier (`abstract` or `final`), visibility modifier (`public`, `protected`, or `private`), set-visibility modifier (`public(set)`, `protected(set)`, or `private(set)`), scope modifier (`static`), mutation modifier (`readonly`), type declaration, name." }
multiline-comment-opening-closing = { group = "comments", fix = "safe", ported = false, status = "decided", summary = "DocBlocks must start with two asterisks, multiline comments must start with a single asterisk, after the opening slash. Both must end with a single asterisk before the closing slash." }
multiline-promoted-properties = { group = "functions", fix = "safe", ported = false, status = "decided", summary = "Promoted properties must be on separate lines." }
multiline-string-to-heredoc = { group = "strings", fix = "safe", ported = false, status = "decided", summary = "Convert multiline string to `heredoc` or `nowdoc`." }
multiline-whitespace-before-semicolons = { group = "whitespace", fix = "safe", presets = ["laravel"], ported = true, status = "decided", summary = "Forbid multi-line whitespace before the closing semicolon or move the semicolon to the new line for chained calls." }
native-function-casing = { group = "casing", fix = "safe", presets = ["laravel", "symfony"], ported = true, status = "decided", summary = "Function defined by PHP should be called using the correct casing." }
native-type-declaration-casing = { group = "casing", fix = "safe", presets = ["laravel", "symfony"], ported = true, status = "decided", summary = "Native type declarations should be used in the correct case." }
new-expression-parentheses = { group = "operators", fix = "safe", ported = false, status = "decided", summary = "All `new` expressions with a further call must (not) be wrapped in parentheses." }
new-with-parentheses = { group = "operators", fix = "safe", presets = ["laravel", "per", "psr12", "symfony"], ported = true, status = "decided", summary = "All instances created with `new` keyword must (not) be followed by parentheses." }
no-alias-language-construct-call = { group = "syntax", fix = "safe", presets = ["laravel", "symfony"], ported = true, status = "decided", summary = "Master language constructs shall be used instead of aliases." }
no-alternative-syntax = { group = "control-flow", fix = "safe", presets = ["laravel", "symfony"], ported = true, status = "decided", summary = "Replace control structure alternative syntax to use braces." }
no-binary-string = { group = "strings", fix = "safe", presets = ["laravel", "symfony"], ported = true, status = "decided", summary = "There should not be a binary flag before strings." }
no-blank-lines-after-class-opening = { group = "classes", fix = "safe", presets = ["laravel", "per", "psr12", "symfony"], ported = true, status = "decided", summary = "There should be no empty lines after class opening brace." }
no-blank-lines-after-phpdoc = { group = "phpdoc", fix = "safe", presets = ["laravel", "symfony"], ported = true, status = "decided", summary = "There should not be blank lines between docblock and the documented element." }
no-break-comment = { group = "control-flow", fix = "safe", presets = ["per", "psr12", "symfony"], ported = true, status = "decided", summary = "There must be a comment when fall-through is intentional in a non-empty case body." }
no-closing-tag = { group = "syntax", fix = "safe", presets = ["laravel", "per", "psr12", "symfony"], ported = true, status = "decided", summary = "The closing `?>` tag MUST be omitted from files containing only PHP." }
no-empty-comment = { group = "comments", fix = "safe", presets = ["symfony"], ported = false, status = "decided", summary = "There should not be any empty comments." }
no-empty-phpdoc = { group = "phpdoc", fix = "safe", presets = ["laravel", "symfony"], ported = true, status = "decided", summary = "There should not be empty PHPDoc blocks." }
no-empty-statement = { group = "whitespace", fix = "safe", presets = ["laravel", "symfony"], ported = true, status = "decided", summary = "Remove useless (semicolon) statements." }
no-extra-blank-lines = { group = "whitespace", fix = "safe", presets = ["laravel", "per", "psr12", "symfony"], ported = true, status = "decided", summary = "Removes extra blank lines and/or blank lines following configuration." }
no-leading-import-slash = { group = "imports", fix = "safe", presets = ["laravel", "per", "psr12", "symfony"], ported = true, status = "decided", summary = "Remove leading slashes in `use` clauses." }
no-leading-namespace-whitespace = { group = "imports", fix = "safe", presets = ["laravel", "symfony"], ported = true, status = "decided", summary = "The namespace declaration line shouldn't contain leading whitespace." }
no-mixed-echo-print = { group = "syntax", fix = "safe", presets = ["laravel", "symfony"], ported = true, status = "decided", summary = "Either language construct `print` or `echo` should be used." }
no-multiline-whitespace-around-double-arrow = { group = "syntax", fix = "safe", presets = ["laravel", "symfony"], ported = true, status = "decided", summary = "Operator `=>` should not be surrounded by multi-line whitespaces." }
no-multiple-statements-per-line = { group = "syntax", fix = "safe", presets = ["laravel", "per", "psr12", "symfony"], ported = true, status = "decided", summary = "There must not be more than one statement per line." }
no-null-property-initialization = { group = "classes", fix = "safe", presets = ["symfony"], ported = false, status = "decided", summary = "Properties MUST not be explicitly initialised with `null` except when they have a type declaration (PHP 7.4)." }
no-redundant-readonly-property = { group = "classes", fix = "safe", ported = false, status = "decided", summary = "Removes redundant readonly from properties in readonly classes." }
no-short-bool-cast = { group = "syntax", fix = "safe", presets = ["laravel", "symfony"], ported = true, status = "decided", summary = "Short cast `bool` using double exclamation mark should not be used." }
no-singleline-whitespace-before-semicolons = { group = "whitespace", fix = "safe", presets = ["laravel", "symfony"], ported = true, status = "decided", summary = "Single-line whitespace before closing semicolon are prohibited." }
no-space-around-double-colon = { group = "operators", fix = "safe", presets = ["laravel", "per", "psr12", "symfony"], ported = true, status = "decided", summary = "There must be no space around double colons (also called Scope Resolution Operator or Paamayim Nekudotayim)." }
no-spaces-after-function-name = { group = "functions", fix = "safe", presets = ["laravel", "per", "psr12", "symfony"], ported = true, status = "decided", summary = "When making a method or function call, there MUST NOT be a space between the method or function name and the opening parenthesis." }
no-spaces-around-offset = { group = "whitespace", fix = "safe", presets = ["laravel", "symfony"], ported = true, status = "decided", summary = "There MUST NOT be spaces around offset braces." }
no-superfluous-elseif = { group = "control-flow", fix = "safe", ported = true, status = "decided", summary = "Replaces superfluous `elseif` with `if`." }
no-superfluous-phpdoc-tags = { group = "phpdoc", fix = "safe", presets = ["laravel", "symfony"], ported = true, status = "decided", aliases = ["no-duplicated-return-self-docblock", "no-mixed-docblock-overruled-by-native-type", "no-useless-readonly-tag", "no-void-docblock-from-magic-method"], summary = "Removes `@param`, `@return` and `@var` tags that don't provide any useful information." }
no-trailing-comma-in-singleline = { group = "syntax", fix = "safe", presets = ["laravel", "symfony"], ported = true, status = "decided", summary = "If a list of values separated by a comma is contained on a single line, then the last item MUST NOT have a trailing comma." }
no-trailing-whitespace = { group = "whitespace", fix = "safe", presets = ["laravel", "per", "psr12", "symfony"], ported = true, status = "decided", summary = "There must be no trailing whitespace at the end of non-blank lines." }
no-trailing-whitespace-in-comment = { group = "comments", fix = "safe", presets = ["laravel", "per", "psr12", "symfony"], ported = true, status = "decided", summary = "There must be no trailing whitespace at the end of lines in comments and PHPDocs." }
no-unneeded-braces = { group = "control-flow", fix = "safe", presets = ["laravel", "symfony"], ported = true, status = "decided", summary = "Removes unneeded braces that are superfluous and aren't part of a control structure's body." }
no-unneeded-control-parentheses = { group = "control-flow", fix = "safe", presets = ["laravel", "symfony"], ported = true, status = "decided", summary = "Removes unneeded parentheses around control statements." }
no-unneeded-import-alias = { group = "imports", fix = "safe", presets = ["laravel", "symfony"], ported = true, status = "decided", summary = "Imports should not be aliased as the same name." }
no-unset-cast = { group = "syntax", fix = "safe", presets = ["laravel", "symfony"], ported = true, status = "decided", summary = "Variables must be set `null` instead of using `(unset)` casting." }
no-unused-imports = { group = "imports", fix = "safe", presets = ["laravel", "per", "psr12", "symfony"], ported = true, status = "decided", summary = "Unused `use` statements must be removed." }
no-useless-concat-operator = { group = "operators", fix = "safe", presets = ["symfony"], ported = false, status = "decided", summary = "There should not be useless concat operations." }
no-useless-else = { group = "control-flow", fix = "safe", presets = ["symfony"], ported = true, status = "decided", summary = "There should not be useless `else` cases." }
no-useless-nullsafe-operator = { group = "operators", fix = "safe", presets = ["symfony"], ported = false, status = "decided", summary = "There should not be useless Null-safe operator `?->` used." }
no-useless-return = { group = "syntax", fix = "safe", presets = ["laravel", "symfony"], ported = true, status = "decided", summary = "There should not be an empty `return` statement at the end of a function." }
no-whitespace-before-comma-in-array = { group = "syntax", fix = "safe", presets = ["laravel", "symfony"], ported = true, status = "decided", summary = "In array declaration, there MUST NOT be a whitespace before each comma." }
no-whitespace-in-blank-line = { group = "whitespace", fix = "safe", presets = ["laravel", "per", "psr12", "symfony"], ported = true, status = "decided", summary = "Remove trailing whitespace at the end of blank lines." }
