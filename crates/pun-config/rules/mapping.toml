# Pun rule placement and upstream mapping. Design: context/plan/rules.md and config.md §4-§5. Checked by
# scripts/check-rule-mapping.py. Drives `pun migrate` (upstream config, ignores and baselines -> pun.toml),
# `pun explain <rule>` (upstream names and docs links) and the generated docs page "Coming from Pint / PHPStan / Rector".
#
# [meta.groups]      the fixed group list, one line each, shared by all three commands: topic groups, the ecosystem
#                    groups (laravel, pest, phpunit, doctrine) and one upgrade group per target (php-8.4, laravel-13).
# [rules.<command>]  every Pun rule, keyed "<group>/<name>"; its ID is "<command>/<group>/<name>"
#                    (format/imports/ordered). Names are kebab-case, unique within their group, and don't repeat it.
#                    There are no aliases: an old Pun name or an upstream name in pun.toml is an error naming the ID.
#   fix       safe | unsafe | mixed | none, a label (format: always safe; mixed = safe where analysis proves it)
#   intent    (lint) correctness | suspicious; absent means a better way to write it
#   presets   (format) the format presets that enable it: laravel | psr12
#   sets      (lint) the lint sets that enable it: dead-code | modernize | code-quality | types | early-return |
#             privatization | naming | coding-style (Rector's prepared sets). None: opt-in by name or group.
#             An ecosystem or upgrade group's rules only run when that ecosystem / version is on.
#   preset    (analyse) the lowest analyse preset that enables it, from PHPStan's level: basic (0-1) <
#             essential (2-3) < recommended (4-5) < strict (6-8) < max (9-10). None: opt-in.
#   fixed_by  (analyse) lint rules whose fix resolves this report; `pun check` shows one diagnostic
#   gated_by  php-version / laravel-version: only runs when [php] version / the locked Laravel version allows
#   ported    implemented in Pun today
#   status    decided
#   merged    every upstream source of a rule built by merging several rules ("tool:id")
#   pun_only  the rule has no upstream source (Pun's own rule)
# [options."<rule ID>"]  every option of a format rule under its Pun name, with its PHP-CS-Fixer name and type
#                    (the fields are described above the first table).
# [upstream.<tool>]  every upstream rule -> pun (rule ID), or drop / unsupported with a reason. The key is the exact
#   upstream ID: CS-Fixer rule name, Rector class short name (FQCN in `class`), PHPStan identifier, Mago rule code.
#   class     (Rector, Pest) fully qualified class name
#   options   how upstream options carry over
#   status    decided

[meta]
schema = 2
upstream = { php-cs-fixer = "3.95.17", pint = "1.30 (oracle .oracle/pint)", rector = "2.6.1", rector-laravel = "driftingly/rector-laravel 2.5.0", pest-plugin-rector = "5.x-dev@1a4b6b7", rector-phpunit = "dev-main@e68085d (bundled with Rector 2.6.1)", phpstan = "2.2.7", phpstan-strict-rules = "2.0.12", phpstan-deprecation-rules = "2.0.5", larastan = "3.10.0", mago = "1.57.0" }
ecosystems = ["laravel", "pest", "phpunit", "doctrine"]
sets = ["dead-code", "modernize", "code-quality", "types", "early-return", "privatization", "naming", "coding-style"]
presets = { format = ["laravel", "psr12", "empty"], analyse = ["basic", "essential", "recommended", "strict", "max"] }
# [analyse] type switches each analyse preset turns on (cumulative); PHPStan levels 7-10
preset_switches = { strict = ["union-types", "nullables"], max = ["explicit-mixed", "implicit-mixed"] }
conflicts = [
  ["format/imports/single-per-statement", "format/imports/group"],
  ["lint/control-flow/prefer-bare-return", "lint/complexity/require-consistent-return"],
  ["lint/style/prefer-short-ternary", "lint/style/no-short-ternary"],
]

[meta.groups]
arrays = "Array literals, list() destructuring and array access"
attributes = "PHP attributes (#[...])"
casing = "The casing of keywords, constants, types and names"
casts = "Type casts"
classes = "Class, interface, trait and enum declarations and their members"
comments = "Comments other than PHPDoc, including ignore comments"
complexity = "Code that can be written more simply, and size and complexity limits"
control-flow = "if, switch, match, loops, return and the other control structures"
dead-code = "Code that never runs, or whose result is never used"
debug = "Type debugging helpers (dumpType, assertType)"
deprecated = "Uses of something marked deprecated"
functions = "Function and method declarations, calls, arguments and closures"
imports = "Namespaces and use imports"
operators = "Operators and their operands"
performance = "Faster equivalents of slow constructs"
phpdoc = "PHPDoc blocks and tags"
refactor = "Configurable codemods: they do nothing until configured"
security = "Code that can be exploited, or that leaks or hides data"
statements = "Statements, declare and semicolons"
strings = "String literals, heredoc and nowdoc"
style = "One consistent way to write the same thing"
tags = "The PHP open and close tags"
types = "Type declarations, type checks and inferred types"
undefined = "References to something declared nowhere"
whitespace = "Indentation, blank lines, line endings and trailing whitespace"
laravel = "Laravel (ecosystem: on when composer.lock has laravel/framework)"
pest = "Pest (ecosystem: on when composer.lock has pestphp/pest)"
phpunit = "PHPUnit (ecosystem: on when composer.lock has phpunit/phpunit)"
doctrine = "Doctrine annotations (ecosystem)"
laravel-12 = "Upgrade to Laravel 12: code a newer Laravel removes, deprecates or does better"
"php-8.1" = "Upgrade to PHP 8.1: code a newer PHP removes, deprecates or does better"
"php-8.4" = "Upgrade to PHP 8.4: code a newer PHP removes, deprecates or does better"
"php-8.5" = "Upgrade to PHP 8.5: code a newer PHP removes, deprecates or does better"
"php-8.6" = "Upgrade to PHP 8.6: code a newer PHP removes, deprecates or does better"

[rules.format]
"arrays/indentation" = { fix = "safe", presets = ["laravel"], ported = true, status = "decided", summary = "Each element of an array must be indented exactly once." }
"arrays/index-brace" = { fix = "safe", presets = ["laravel"], ported = true, status = "decided", summary = "Array index should always be written by using square braces." }
"arrays/list-syntax" = { fix = "safe", presets = ["laravel"], ported = true, status = "decided", summary = "List (`array` destructuring) assignment should be declared using the configured syntax." }
"arrays/no-multiline-double-arrow" = { fix = "safe", presets = ["laravel"], ported = true, status = "decided", summary = "Operator `=>` should not be surrounded by multi-line whitespaces." }
"arrays/no-space-around-offset" = { fix = "safe", presets = ["laravel"], ported = true, status = "decided", summary = "There MUST NOT be spaces around offset braces." }
"arrays/no-space-before-comma" = { fix = "safe", presets = ["laravel"], ported = true, status = "decided", summary = "In array declaration, there MUST NOT be a whitespace before each comma." }
"arrays/no-space-in-empty" = { fix = "safe", ported = false, status = "decided", summary = "Empty arrays should not contain only whitespace." }
"arrays/no-trailing-comma-single-line" = { fix = "safe", presets = ["laravel"], ported = true, status = "decided", summary = "If a list of values separated by a comma is contained on a single line, then the last item MUST NOT have a trailing comma." }
"arrays/space-after-comma" = { fix = "safe", presets = ["laravel"], ported = true, status = "decided", summary = "In array declaration, there MUST be a whitespace after each comma." }
"arrays/syntax" = { fix = "safe", presets = ["laravel"], ported = true, status = "decided", summary = "PHP arrays should be declared using the configured syntax." }
"arrays/trailing-comma-multiline" = { fix = "safe", presets = ["laravel"], ported = true, status = "decided", summary = "Arguments lists, array destructuring lists, arrays that are multi-line, `match`-lines and parameters lists must have a trailing comma." }
"arrays/trim-spaces" = { fix = "safe", presets = ["laravel"], ported = true, status = "decided", summary = "Arrays should be formatted like function/method arguments, without leading or trailing single line space." }
"attributes/empty-parentheses" = { fix = "safe", ported = false, status = "decided", summary = "PHP attributes declared without arguments must (not) be followed by empty parentheses." }
"attributes/no-block-spaces" = { fix = "safe", ported = false, status = "decided", summary = "Remove spaces before and after the attributes block." }
"attributes/ordered" = { fix = "safe", ported = false, status = "decided", summary = "Sorts attributes using the configured sort algorithm." }
"casing/class-reference" = { fix = "safe", ported = true, status = "decided", summary = "When referencing an internal class it must be written using the correct casing." }
"casing/constants" = { fix = "safe", presets = ["laravel", "psr12"], ported = true, status = "decided", summary = "The PHP constants `true`, `false`, and `null` MUST be written using the correct casing." }
"casing/integer-literals" = { fix = "safe", presets = ["laravel"], ported = true, status = "decided", summary = "Integer literals must be in correct case." }
"casing/keywords" = { fix = "safe", presets = ["laravel", "psr12"], ported = true, status = "decided", summary = "PHP keywords MUST be in lower case." }
"casing/magic-constants" = { fix = "safe", presets = ["laravel"], ported = true, status = "decided", summary = "Magic constants should be referred to using the correct casing." }
"casing/magic-methods" = { fix = "safe", presets = ["laravel"], ported = true, status = "decided", summary = "Magic method definitions and calls must be using the correct casing." }
"casing/native-functions" = { fix = "safe", presets = ["laravel"], ported = true, status = "decided", summary = "Function defined by PHP should be called using the correct casing." }
"casing/native-types" = { fix = "safe", presets = ["laravel"], ported = true, status = "decided", summary = "Native type declarations should be used in the correct case." }
"casing/static-reference" = { fix = "safe", presets = ["laravel", "psr12"], ported = true, status = "decided", summary = "Class static references `self`, `static` and `parent` MUST be in lower case." }
"casts/lowercase" = { fix = "safe", presets = ["laravel", "psr12"], ported = true, status = "decided", summary = "Cast should be written in lower case." }
"casts/no-short-bool" = { fix = "safe", presets = ["laravel"], ported = true, status = "decided", summary = "Short cast `bool` using double exclamation mark should not be used." }
"casts/no-unset" = { fix = "safe", presets = ["laravel"], ported = true, status = "decided", summary = "Variables must be set `null` instead of using `(unset)` casting." }
"casts/short-scalar" = { fix = "safe", presets = ["laravel", "psr12"], ported = true, status = "decided", summary = "Cast `(boolean)` and `(integer)` should be written as `(bool)` and `(int)`, `(double)` and `(real)` as `(float)`, `(binary)` as `(string)`." }
"casts/spacing" = { fix = "safe", presets = ["laravel"], ported = true, status = "decided", summary = "A single space or none should be between cast and variable." }
"classes/definition" = { fix = "safe", presets = ["laravel", "psr12"], ported = true, status = "decided", summary = "Whitespace around the keywords of a class, trait, enum or interfaces definition should be one space." }
"classes/member-separation" = { fix = "safe", presets = ["laravel"], ported = true, status = "decided", summary = "Class, trait and interface elements must be separated with one or none blank line." }
"classes/modifier-keywords" = { fix = "safe", presets = ["laravel", "psr12"], ported = true, status = "decided", summary = "Classes, constants, properties, and methods MUST have visibility declared, and keyword modifiers MUST be in the following order: inheritance modifier (`abstract` or `final`), visibility modifier (`public`, `protected`, or `private`), set-visibility modifier (`public(set)`, `protected(set)`, or `private(set)`), scope modifier (`static`), mutation modifier (`readonly`), type declaration, name." }
"classes/multiline-promoted-properties" = { fix = "safe", ported = false, status = "decided", summary = "Promoted properties must be on separate lines." }
"classes/no-blank-line-after-opening" = { fix = "safe", presets = ["laravel", "psr12"], ported = true, status = "decided", summary = "There should be no empty lines after class opening brace." }
"classes/ordered-interfaces" = { fix = "safe", presets = ["laravel"], ported = true, status = "decided", summary = "Orders the interfaces in an `implements` or `interface extends` clause." }
"classes/single-member-per-statement" = { fix = "safe", presets = ["laravel", "psr12"], ported = true, status = "decided", summary = "There MUST NOT be more than one property or constant declared per statement." }
"classes/single-trait-per-statement" = { fix = "safe", presets = ["psr12"], ported = true, status = "decided", summary = "Each trait `use` must be done as single statement." }
"comments/align-multiline" = { fix = "safe", ported = true, status = "decided", summary = "Each line of multi-line DocComments must have an asterisk [PSR-5] and must be aligned with the first one." }
"comments/header" = { fix = "safe", ported = false, status = "decided", summary = "Add, replace or remove header comment." }
"comments/multiline-delimiters" = { fix = "safe", ported = false, status = "decided", summary = "DocBlocks must start with two asterisks, multiline comments must start with a single asterisk, after the opening slash. Both must end with a single asterisk before the closing slash." }
"comments/no-empty" = { fix = "safe", ported = false, status = "decided", summary = "There should not be any empty comments." }
"comments/no-trailing-whitespace" = { fix = "safe", presets = ["laravel", "psr12"], ported = true, status = "decided", summary = "There must be no trailing whitespace at the end of lines in comments and PHPDocs." }
"comments/single-line-spacing" = { fix = "safe", presets = ["laravel"], ported = true, status = "decided", summary = "Single-line comments must have proper spacing." }
"comments/single-line-style" = { fix = "safe", presets = ["laravel"], ported = true, status = "decided", summary = "Single-line comments and multi-line comments with only one line of actual content should use the `//` syntax." }
"control-flow/braces" = { fix = "safe", presets = ["laravel", "psr12"], ported = true, status = "decided", summary = "The body of each control structure MUST be enclosed within braces." }
"control-flow/continuation-position" = { fix = "safe", presets = ["laravel", "psr12"], ported = true, status = "decided", summary = "Control structure continuation keyword must be on the configured line." }
"control-flow/elseif" = { fix = "safe", presets = ["laravel", "psr12"], ported = true, status = "decided", summary = "The keyword `elseif` should be used instead of `else if` so that all control keywords look like single words." }
"control-flow/empty-loop-body" = { fix = "safe", ported = false, status = "decided", summary = "Empty loop-body must be in configured style." }
"control-flow/empty-loop-condition" = { fix = "safe", ported = false, status = "decided", summary = "Empty loop-condition must be in configured style." }
"control-flow/include" = { fix = "safe", presets = ["laravel"], ported = true, status = "decided", summary = "Include/Require and file path should be divided with a single space. File path should not be placed within parentheses." }
"control-flow/no-alternative-syntax" = { fix = "safe", presets = ["laravel"], ported = true, status = "decided", summary = "Replace control structure alternative syntax to use braces." }
"control-flow/no-break-comment" = { fix = "safe", presets = ["psr12"], ported = true, status = "decided", summary = "There must be a comment when fall-through is intentional in a non-empty case body." }
"control-flow/no-unneeded-braces" = { fix = "safe", presets = ["laravel"], ported = true, status = "decided", summary = "Removes unneeded braces that are superfluous and aren't part of a control structure's body." }
"control-flow/no-unneeded-parentheses" = { fix = "safe", presets = ["laravel"], ported = true, status = "decided", summary = "Removes unneeded parentheses around control statements." }
"control-flow/switch-case-colon" = { fix = "safe", presets = ["laravel", "psr12"], ported = true, status = "decided", summary = "A case should be followed by a colon and not a semicolon." }
"control-flow/switch-case-space" = { fix = "safe", presets = ["laravel", "psr12"], ported = true, status = "decided", summary = "Removes extra spaces between colon and case value." }
"control-flow/yoda" = { fix = "safe", presets = ["laravel"], ported = true, status = "decided", summary = "Write conditions in Yoda style (`true`), non-Yoda style (`['equal' => false, 'identical' => false, 'less_and_greater' => false]`) or ignore those conditions (`null`) based on configuration." }
"doctrine/annotation-array-assignment" = { fix = "safe", ported = false, status = "decided", summary = "Doctrine annotations must use configured operator for assignment in arrays." }
"doctrine/annotation-braces" = { fix = "safe", ported = false, status = "decided", summary = "Doctrine annotations without arguments must use the configured syntax." }
"doctrine/annotation-indentation" = { fix = "safe", ported = false, status = "decided", summary = "Doctrine annotations must be indented with four spaces." }
"doctrine/annotation-spaces" = { fix = "safe", ported = false, status = "decided", summary = "Fixes spaces in Doctrine annotations." }
"functions/argument-spacing" = { fix = "safe", presets = ["laravel", "psr12"], ported = true, status = "decided", summary = "In method arguments and method call, there MUST NOT be a space before each comma and there MUST be one space after each comma. Argument lists MAY be split across multiple lines, where each subsequent line is indented once. When doing so, the first item in the list MUST be on the next line, and there MUST be only one argument per line." }
"functions/backtick-to-shell-exec" = { fix = "safe", ported = true, status = "decided", summary = "Converts backtick operators to `shell_exec` calls." }
"functions/chain-indentation" = { fix = "safe", presets = ["laravel"], ported = true, status = "decided", summary = "Method chaining MUST be properly indented. Method chaining with different levels of indentation is not supported." }
"functions/declaration" = { fix = "safe", presets = ["laravel", "psr12"], ported = true, status = "decided", summary = "Spaces should be properly placed in a function declaration." }
"functions/no-alias-construct-call" = { fix = "safe", presets = ["laravel"], ported = true, status = "decided", summary = "Master language constructs shall be used instead of aliases." }
"functions/no-space-after-name" = { fix = "safe", presets = ["laravel", "psr12"], ported = true, status = "decided", summary = "When making a method or function call, there MUST NOT be a space between the method or function name and the opening parenthesis." }
"functions/return-type-spacing" = { fix = "safe", presets = ["laravel", "psr12"], ported = true, status = "decided", summary = "Adjust spacing around colon in return type declarations and backed enum types." }
"functions/single-line-throw" = { fix = "safe", ported = false, status = "decided", summary = "Throwing exception must be done in single line." }
"imports/blank-line-after" = { fix = "safe", presets = ["laravel", "psr12"], ported = true, status = "decided", summary = "Each namespace use MUST go on its own line and there MUST be one blank line after the use statements block." }
"imports/blank-line-after-namespace" = { fix = "safe", presets = ["laravel", "psr12"], ported = true, status = "decided", summary = "There MUST be one blank line after the namespace declaration." }
"imports/blank-line-between-groups" = { fix = "safe", presets = ["laravel", "psr12"], ported = true, status = "decided", summary = "Putting blank lines between `use` statement groups." }
"imports/blank-lines-before-namespace" = { fix = "safe", presets = ["laravel", "psr12"], ported = true, status = "decided", summary = "Controls blank lines before a namespace declaration." }
"imports/clean-namespace" = { fix = "safe", presets = ["laravel"], ported = true, status = "decided", summary = "Namespace must not contain spacing, comments or PHPDoc." }
"imports/fully-qualified-strict-types" = { fix = "safe", presets = ["laravel"], ported = true, status = "decided", summary = "Removes the leading part of fully qualified symbol references if a given symbol is imported or belongs to the current namespace." }
"imports/global-namespace" = { fix = "safe", ported = true, status = "decided", summary = "Imports or fully qualifies global classes/functions/constants." }
"imports/group" = { fix = "safe", ported = false, status = "decided", summary = "There MUST be group use for the same namespaces." }
"imports/no-leading-namespace-whitespace" = { fix = "safe", presets = ["laravel"], ported = true, status = "decided", summary = "The namespace declaration line shouldn't contain leading whitespace." }
"imports/no-leading-slash" = { fix = "safe", presets = ["laravel", "psr12"], ported = true, status = "decided", summary = "Remove leading slashes in `use` clauses." }
"imports/no-unneeded-alias" = { fix = "safe", presets = ["laravel"], ported = true, status = "decided", summary = "Imports should not be aliased as the same name." }
"imports/ordered" = { fix = "safe", presets = ["laravel", "psr12"], ported = true, status = "decided", summary = "Ordering `use` statements." }
"imports/single-per-statement" = { fix = "safe", presets = ["laravel", "psr12"], ported = true, status = "decided", summary = "There MUST be one use keyword per declaration." }
"laravel/blade" = { fix = "safe", ported = true, status = "decided", summary = "Formats Blade templates (Pint 1.30, Prettier + prettier-plugin-blade)." }
"operators/binary-spacing" = { fix = "safe", presets = ["laravel", "psr12"], ported = true, status = "decided", summary = "Binary operators should be surrounded by space as configured." }
