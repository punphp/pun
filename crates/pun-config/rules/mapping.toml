ternary-operator-spaces = { group = "operators", fix = "safe", presets = ["laravel", "per", "psr12", "symfony"], ported = true, status = "decided", summary = "Standardize spaces around ternary operator." }
ternary-to-null-coalescing = { group = "operators", fix = "safe", ported = false, status = "decided", summary = "Use `null` coalescing operator `??` where possible." }
trailing-comma-in-multiline = { group = "control-flow", fix = "safe", presets = ["laravel", "per", "symfony"], ported = true, status = "decided", summary = "Arguments lists, array destructuring lists, arrays that are multi-line, `match`-lines and parameters lists must have a trailing comma." }
trim-array-spaces = { group = "syntax", fix = "safe", presets = ["laravel", "symfony"], ported = true, status = "decided", summary = "Arrays should be formatted like function/method arguments, without leading or trailing single line space." }
type-declaration-spaces = { group = "whitespace", fix = "safe", presets = ["laravel", "symfony"], ported = true, status = "decided", summary = "Ensure single space between a variable and its type declaration in function arguments and properties." }
types-spaces = { group = "whitespace", fix = "safe", presets = ["laravel", "per", "symfony"], ported = true, status = "decided", summary = "A single space or none should be around union type and intersection type operators." }
unary-operator-spaces = { group = "operators", fix = "safe", presets = ["laravel", "per", "psr12", "symfony"], ported = true, status = "decided", summary = "Unary operators should be placed adjacent to their operands." }
whitespace-after-comma-in-array = { group = "syntax", fix = "safe", presets = ["laravel", "symfony"], ported = true, status = "decided", summary = "In array declaration, there MUST be a whitespace after each comma." }
yoda-style = { group = "control-flow", fix = "safe", presets = ["laravel", "symfony"], ported = true, status = "decided", summary = "Write conditions in Yoda style (`true`), non-Yoda style (`['equal' => false, 'identical' => false, 'less_and_greater' => false]`) or ignore those conditions (`null`) based on configuration." }

