"functions/no-space-after-name" = { fix = "safe", presets = ["laravel", "psr12"], ported = true, status = "decided", summary = "When making a method or function call, there MUST NOT be a space between the method or function name and the opening parenthesis." }
"functions/return-type-spacing" = { fix = "safe", presets = ["laravel", "psr12"], ported = true, status = "decided", summary = "Adjust spacing around colon in return type declarations and backed enum types." }
"functions/single-line-throw" = { fix = "safe", ported = false, status = "decided", summary = "Throwing exception must be done in single line." }
"imports/blank-line-after" = { fix = "safe", presets = ["laravel", "psr12"], ported = true, status = "decided", summary = "Each namespace use MUST go on its own line and there MUST be one blank line after the use statements block." }
