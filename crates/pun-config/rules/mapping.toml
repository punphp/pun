# Format rule options, as pun.toml takes them (context/plan/format.md Decisions, "Option names"). One table per
# format rule that has options, keyed by its Pun option name (kebab-case); every option of the PHP-CS-Fixer fixer
# behind the rule is listed. `pun format` translates them to the fixer's options and `pun migrate` translates back.
#   upstream  the PHP-CS-Fixer option name
#   type      bool | int | string | enum (one of `values`) | list (of strings; only `values` when set) |
#             list-of-lists (of strings) | map (string keys; `keys` and `values` limit them when set) |
#             int-or-map (an int, or a map of strings to ints)
#   values    Pun value = upstream value, for the values Pun spells differently or that are a closed list
#   keys      Pun key = upstream key, for a map with a closed key list
#   null      the string that stands for upstream's `null` (TOML has no null)
#   nullable  upstream also takes `null`, which pun.toml writes by leaving the option out
