"imports/fully-qualified-strict-types" = { fix = "safe", presets = ["laravel"], ported = true, status = "decided", summary = "Removes the leading part of fully qualified symbol references if a given symbol is imported or belongs to the current namespace." }
"imports/global-namespace" = { fix = "safe", ported = true, status = "decided", summary = "Imports or fully qualifies global classes/functions/constants." }
