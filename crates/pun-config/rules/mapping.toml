phpdoc-tag-type = { group = "phpdoc", fix = "safe", presets = ["laravel", "symfony"], ported = true, status = "decided", summary = "Forces PHPDoc tags to be either regular annotations or inline." }
phpdoc-to-comment = { group = "phpdoc", fix = "safe", presets = ["symfony"], ported = false, status = "decided", summary = "Docblocks should only be used on structural elements." }
