[package]
name = "punphp-analyse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Pun's `pun analyse`: PHPStan's rules on Mago's parser, names, codex and inference"
repository.workspace = true
homepage.workspace = true
keywords = ["php", "phpstan", "static-analysis"]
categories.workspace = true

[lib]
name = "pun_analyse"

[dependencies]
pun-phpstan.workspace = true
pun-tokens.workspace = true
pcre2.workspace = true
regex-automata.workspace = true
mago-allocator.workspace = true
mago-analyzer.workspace = true
mago-codex.workspace = true
mago-database.workspace = true
mago-names.workspace = true
mago-phpdoc-syntax.workspace = true
mago-prelude.workspace = true
mago-php-version.workspace = true
mago-word.workspace = true
mago-span.workspace = true
mago-syntax.workspace = true
serde_json.workspace = true
rayon.workspace = true
foldhash.workspace = true
zip.workspace = true
tar.workspace = true
flate2.workspace = true
sha1.workspace = true
sha2.workspace = true
md-5.workspace = true

[dev-dependencies]
mago-reporting.workspace = true
mago-codex = { workspace = true, features = ["serde"] }
mago-extension = "=1.57.0"
