[package]
name = "punphp-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pun's language server: PHPantom's code intelligence plus Pun's Pint formatting, lint diagnostics and fixes"
repository.workspace = true

[lib]
name = "pun_lsp"

# Standalone server for tests and benchmarks; `pun lsp` will call `pun_lsp::run()`.
[[bin]]
name = "pun-lsp"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
lsp-server.workspace = true
pun-config.workspace = true
pun-format.workspace = true
pun-fixers.workspace = true
pun-workspace.workspace = true
mago-allocator.workspace = true
mago-database.workspace = true
mago-linter.workspace = true
mago-names.workspace = true
mago-reporting.workspace = true
mago-syntax.workspace = true
phpantom_lsp.workspace = true
tower-lsp.workspace = true
tower.workspace = true
futures.workspace = true
tokio.workspace = true
crossbeam-channel.workspace = true
