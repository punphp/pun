[package]
name = "punphp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Pun: a fast, byte-for-byte Laravel Pint compatible PHP formatter written in Rust"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

# Release builds (dist) ship `pun lint --mago`.
[package.metadata.dist]
features = ["mago-lint"]

[[bin]]
name = "pun"
path = "src/main.rs"

[dependencies]
pprof = { workspace = true, optional = true }
agent-detector.workspace = true
anyhow.workspace = true
clap.workspace = true
rayon.workspace = true
serde_json.workspace = true
xxhash-rust.workspace = true
toml.workspace = true
pun-config.workspace = true
pun-format.workspace = true
pun-fixers.workspace = true
pun-workspace.workspace = true
pun-problem.workspace = true
pun-tokens.workspace = true
pcre2.workspace = true
notify.workspace = true
dialoguer.workspace = true
mago-allocator = { workspace = true, optional = true }
mago-database = { workspace = true, optional = true }
mago-linter = { workspace = true, optional = true }
mago-names = { workspace = true, optional = true }
mago-reporting = { workspace = true, optional = true }
mago-syntax = { workspace = true, optional = true }

[features]
pprof = ["dep:pprof"]
# `pun lint --mago`: Mago's lint-only Laravel rules. Off by default (mago-linter is ~65k lines to compile).
mago-lint = ["dep:mago-allocator", "dep:mago-database", "dep:mago-linter", "dep:mago-names", "dep:mago-reporting", "dep:mago-syntax"]
