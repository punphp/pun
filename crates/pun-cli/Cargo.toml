[package]
name = "punphp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Pun: format, lint and analyse PHP in one Rust binary, with the same bytes as Pint"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

# publish = false would otherwise leave the binary out of the release archives.
[package.metadata.dist]
dist = true

[[bin]]
name = "pun"
path = "src/main.rs"

[dependencies]
pprof = { workspace = true, optional = true }
agent-detector.workspace = true
anyhow.workspace = true
clap.workspace = true
rayon.workspace = true
serde_json.workspace = true
toml.workspace = true
pun-config.workspace = true
pun-format.workspace = true
pun-fixers.workspace = true
pun-workspace.workspace = true
pun-problem.workspace = true
pun-analyse.workspace = true
pun-lint.workspace = true
pun-phpstan.workspace = true
serde.workspace = true
sha2.workspace = true
md-5.workspace = true
pun-tokens.workspace = true
pcre2.workspace = true
notify.workspace = true
dialoguer.workspace = true

[features]
pprof = ["dep:pprof"]

[lints]
workspace = true
